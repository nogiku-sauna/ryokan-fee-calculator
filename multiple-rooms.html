<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>複数部屋の料金計算</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1ea;color:#25332d;font-family:"Yu Gothic UI",sans-serif}main{max-width:980px;margin:auto;padding:18px}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{color:#285641;text-decoration:none;font-weight:bold}.logo{background:#366b55;color:#fff;border-radius:13px;width:46px;height:46px;display:grid;place-items:center;font-size:25px;font-weight:bold}.head h1{font-size:22px;margin:0}.head p{font-size:11px;color:#6a7770;margin:2px 0 0}.card{background:#fff;border:1px solid #dce3d9;border-radius:17px;padding:19px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:bold;color:#596860}input,select,button{font:inherit}input,select{height:42px;border:1px solid #cbd5cd;border-radius:9px;padding:0 9px;background:#fbfcfa}.note{font-size:11px;color:#68766f;line-height:1.6}.sets{display:grid;gap:12px}.room-set{background:#fff;border:1px solid #dce3d9;border-radius:17px;overflow:hidden}.set-head{display:flex;align-items:center;gap:9px;padding:12px 15px;background:#e8efe9}.set-head h2{font-size:16px;margin:0 auto 0 0}.remove{border:0;background:#fff;color:#a33b32;border-radius:8px;padding:7px 10px}.set-body{padding:15px}.set-top{display:grid;grid-template-columns:1fr 1fr;gap:9px}.counts-title{font-size:13px;margin:17px 0 8px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.count{display:grid;grid-template-columns:1fr 64px;align-items:center;background:#f7f8f5;border-radius:9px;padding:7px}.count small{display:block;font-size:9px;color:#7a8680}.count select{text-align:center;height:36px}.rates{display:grid;gap:7px}.rate-row{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;background:#f5f7f2;padding:7px;border-radius:9px}.set-result{margin-top:12px;padding:11px;background:#eef6f0;border-radius:10px;display:grid;grid-template-columns:1fr auto;gap:6px}.set-result b{text-align:right}.add{width:100%;border:1px dashed #82a18f;background:#fff;color:#285641;border-radius:11px;padding:13px;font-weight:bold;margin:12px 0}.total-card{background:#fff;border:1px solid #dce3d9;border-radius:17px;padding:18px}.paid{margin:10px 0}.paid small{font-weight:normal}.sum-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e7ebe6}.final{margin-top:12px;border:2px solid #e1781d;background:#fff6e8;color:#8b4a0c;border-radius:13px;padding:15px;display:flex;justify-content:space-between;align-items:end}.final strong{font-size:30px}.warning{background:#fff0ee;color:#a33b32;padding:10px;border-radius:9px;font-size:11px;margin-top:10px}@media(max-width:650px){main{padding:10px}.grid,.set-top{grid-template-columns:1fr}.counts{grid-template-columns:repeat(2,1fr)}.head h1{font-size:19px}}
</style>
</head>
<body><main>
<header class="head"><a class="back" href="index.html">← 通常計算</a><div class="logo">の</div><div><h1>複数部屋の料金計算</h1><p>同じ条件の部屋は「部屋数」でまとめ、条件が異なる場合は別セットを追加します。</p></div></header>
<section class="card"><div class="grid"><label>予約元<select id="ota"><option>Agoda</option><option>じゃらん</option><option>楽天</option><option>その他</option></select></label><label>OTA割引率（%）<input id="discount" type="number" min="0" max="100" value="20"></label><label>宿泊数<select id="nightCount"></select></label></div><p class="note">同じ部屋タイプでも、人数や料金区分が違う場合は別の部屋セットとして入力してください。</p></section>
<div class="sets" id="sets"></div><button class="add" id="addSet">＋ 別の部屋セットを追加</button>
<section class="total-card"><label class="paid">事前決済済み金額<input id="paid" type="number" min="0" inputmode="numeric"><small>料金表から自動入力されます。ポイント・クーポン等がある場合は直接変更できます。</small></label><div class="sum-line"><span>変更後の宿泊料金</span><b id="stay">0円</b></div><div class="sum-line"><span>OTA割引</span><b id="off">− 0円</b></div><div class="sum-line"><span>入湯税</span><b id="tax">＋ 0円</b></div><div class="sum-line"><span>変更後合計</span><b id="total">0円</b></div><div class="sum-line"><span>事前決済済み</span><b id="paidOut">− 0円</b></div><div id="warnings"></div><div class="final"><span id="finalLabel">追加でいただく金額</span><strong id="diff">0円</strong></div></section>
</main><script>
const L={85:'85 平1〜',101:'101 平1〜',112:'112 平日',122:'122 平日',132:'132 祝前',142:'142 祝前',152:'152 特日',172:'172 特日'};
const R={5:{85:[18750,12500,11250,10000,9375],101:[22500,15000,13750,12500,11875],112:[0,16500,15250,14000,13375],122:[0,18000,16750,15500,14875],132:[0,19500,18250,17000,16375],142:[0,21000,19750,18500,17875],152:[0,22500,21250,20000,19375],172:[0,25500,24250,23000,22375]},3:{85:[16000,10625,9375],101:[18750,12500,11250],112:[0,13750,12500],122:[0,15000,13750],132:[0,16250,15000],142:[0,17500,16250],152:[0,18750,17500],172:[0,21250,20000]}};
const defs=[['adult','大人・A','13歳以上'],['b','B','6〜12歳'],['cf','C 布団あり','3〜5歳'],['cn','C 布団なし','3〜5歳'],['df','D 布団あり','0〜2歳'],['dn','D 布団なし','0〜2歳']];
const $=id=>document.getElementById(id),yen=x=>Math.round(x).toLocaleString('ja-JP')+'円',num=v=>Math.max(0,Number(v)||0);
let paidManual=false,syncing=false,nextId=2,sets=[makeSet(1)];
function makeSet(id){return{id,room:'5',qty:1,rates:['112'],old:{adult:2,b:0,cf:0,cn:0,df:0,dn:0},now:{adult:2,b:0,cf:0,cn:0,df:0,dn:0}}}
function countOptions(v){return Array.from({length:11},(_,i)=>`<option value="${i}" ${i===v?'selected':''}>${i}名</option>`).join('')}
function draw(){const nights=+$('nightCount').value||1;sets.forEach(s=>{while(s.rates.length<nights)s.rates.push(s.rates[s.rates.length-1]||'112');s.rates.length=nights});$('sets').innerHTML=sets.map((s,si)=>`<section class="room-set"><div class="set-head"><h2>部屋セット ${si+1}</h2>${sets.length>1?`<button class="remove" data-remove="${s.id}">削除</button>`:''}</div><div class="set-body"><div class="set-top"><label>部屋タイプ<select data-id="${s.id}" data-field="room"><option value="5" ${s.room==='5'?'selected':''}>離れ</option><option value="3" ${s.room==='3'?'selected':''}>長屋</option></select></label><label>同じ条件の部屋数<select data-id="${s.id}" data-field="qty">${Array.from({length:5},(_,i)=>`<option value="${i+1}" ${s.qty===i+1?'selected':''}>× ${i+1}部屋</option>`).join('')}</select></label></div><h3 class="counts-title">予約時の1部屋あたり人数</h3><div class="counts">${defs.map(([k,a,b])=>`<label class="count"><span>${a}<small>${b}</small></span><select data-id="${s.id}" data-old="${k}">${countOptions(s.old[k])}</select></label>`).join('')}</div><h3 class="counts-title">変更後の1部屋あたり人数</h3><div class="counts">${defs.map(([k,a,b])=>`<label class="count"><span>${a}<small>${b}</small></span><select data-id="${s.id}" data-now="${k}">${countOptions(s.now[k])}</select></label>`).join('')}</div><h3 class="counts-title">宿泊日ごとの料金区分</h3><div class="rates">${s.rates.map((v,i)=>`<label class="rate-row"><span>${i+1}泊目</span><select data-id="${s.id}" data-rate="${i}">${Object.entries(L).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('')}</select></label>`).join('')}</div><div class="set-result"><span>このセットの変更後合計</span><b id="setTotal${s.id}">0円</b><span>このセットの差額</span><b id="setDiff${s.id}">0円</b></div></div></section>`).join('');bind();calc()}
function bind(){document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{const s=sets.find(x=>x.id===+el.dataset.id);s[el.dataset.field]=el.dataset.field==='qty'?+el.value:el.value;calc()});document.querySelectorAll('[data-old]').forEach(el=>el.onchange=()=>{sets.find(x=>x.id===+el.dataset.id).old[el.dataset.old]=+el.value;calc()});document.querySelectorAll('[data-now]').forEach(el=>el.onchange=()=>{sets.find(x=>x.id===+el.dataset.id).now[el.dataset.now]=+el.value;calc()});document.querySelectorAll('[data-rate]').forEach(el=>el.onchange=()=>{sets.find(x=>x.id===+el.dataset.id).rates[+el.dataset.rate]=el.value;calc()});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{sets=sets.filter(x=>x.id!==+el.dataset.remove);draw()})}
function parts(s,c,k,ota){const cap=+s.room,rates=R[s.room][k],pg=c.adult+c.b+c.cf+c.df,applied=Math.min(Math.max(pg,1),cap),minimum=pg===1&&rates[0]===0,rp=minimum?2:applied,unit=pg?(rates[rp-1]||0):0,dfr=ota==='Agoda'?3500:['じゃらん','楽天'].includes(ota)?1500:3500,dnr=ota==='Agoda'?2000:['じゃらん','楽天'].includes(ota)?0:2000,adult=minimum?unit*2:unit*c.adult,b=minimum?0:unit*.7*c.b,futon=c.cf*3500+c.df*dfr,noFuton=c.cn*2000+c.dn*dnr;return{cap,pg,dnr,standard:adult+b+futon,noFuton,over:pg>cap}}
function originalPrice(s,c,k,ota,disc,taxPeople){const p=parts(s,c,k,ota),base=p.standard+p.noFuton,cut=base*disc/100,tax=taxPeople*250;return{base,cut,tax,total:base-cut+tax,over:p.over}}
function changedPrice(s,old,c,k,ota,disc,taxPeople){const p=parts(s,c,k,ota),addedCn=Math.max(0,c.cn-old.cn),addedDn=Math.max(0,c.dn-old.dn),existingCn=Math.min(c.cn,old.cn),existingDn=Math.min(c.dn,old.dn),addedPriced=Math.max(0,c.b-old.b)+Math.max(0,c.cf-old.cf)+Math.max(0,c.df-old.df)>0,addedNoFuton=addedCn*2000+addedDn*p.dnr,discountableNoFuton=existingCn*2000+existingDn*p.dnr+(addedPriced?addedNoFuton:0),fullPriceNoFuton=addedPriced?0:addedNoFuton,discountable=p.standard+discountableNoFuton,base=discountable+fullPriceNoFuton,cut=discountable*disc/100,tax=taxPeople*250;return{base,cut,tax,total:base-cut+tax,over:p.over}}
function calc(){const ota=$('ota').value,disc=num($('discount').value),taxIncluded=['じゃらん','楽天'].includes(ota);let oldTotal=0,total=0,stay=0,off=0,tax=0,warnings=[];sets.forEach((s,si)=>{let so=0,sn=0;const addedAdults=Math.max(0,s.now.adult-s.old.adult);s.rates.forEach((k,i)=>{const o=originalPrice(s,s.old,k,ota,disc,taxIncluded?0:s.old.adult),n=changedPrice(s,s.old,s.now,k,ota,disc,taxIncluded?addedAdults:s.now.adult);oldTotal+=o.total*s.qty;total+=n.total*s.qty;stay+=n.base*s.qty;off+=n.cut*s.qty;tax+=n.tax*s.qty;so+=o.total*s.qty;sn+=n.total*s.qty;if(n.over)warnings.push(`部屋セット${si+1}・${i+1}泊目は通常定員を超えています。`)});$(`setTotal${s.id}`).textContent=yen(sn);$(`setDiff${s.id}`).textContent=(sn-so>=0?'＋ ':'− ')+yen(Math.abs(sn-so))});if(!paidManual){syncing=true;$('paid').value=Math.round(oldTotal);syncing=false}const paid=num($('paid').value),diff=total-paid;$('stay').textContent=yen(stay);$('off').textContent='− '+yen(off);$('tax').textContent='＋ '+yen(tax);$('total').textContent=yen(total);$('paidOut').textContent='− '+yen(paid);$('finalLabel').textContent=diff>=0?'追加でいただく金額':'返金確認額';$('diff').textContent=yen(Math.abs(diff));$('warnings').innerHTML=warnings.map(x=>`<div class="warning">${x}</div>`).join('')}
$('nightCount').innerHTML=Array.from({length:7},(_,i)=>`<option value="${i+1}">${i+1}泊</option>`).join('');$('nightCount').onchange=draw;$('ota').onchange=calc;$('discount').oninput=calc;$('paid').oninput=()=>{if(!syncing)paidManual=true;calc()};$('addSet').onclick=()=>{sets.push(makeSet(nextId++));draw()};draw();
</script></body></html>
