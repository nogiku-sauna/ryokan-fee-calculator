<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊料金かんたん確認</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1ea;color:#25332d;font-family:"Yu Gothic UI",sans-serif}main{max-width:950px;margin:auto;padding:20px}header{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{background:#366b55;color:#fff;border-radius:15px;width:50px;height:50px;display:grid;place-items:center;font-size:28px;font-weight:bold}h1{font-size:24px;margin:0}header p{margin:0;color:#6a7770;font-size:12px;font-weight:bold}.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px;padding:6px;background:#dfe6dc;border-radius:13px}.mode-switch button{border:0;border-radius:9px;padding:11px 8px;background:transparent;color:#596860;font-weight:bold;cursor:pointer}.mode-switch button.on{background:#fff;color:#285641;box-shadow:0 2px 8px #25332d14}.check-mode .change-only{display:none!important}.layout{display:block}.card{background:#fff;border:1px solid #dce3d9;border-radius:19px;box-shadow:0 10px 30px #25332d0c}.form{padding:24px}h2{font-size:17px;margin:5px 0 13px}h2:not(:first-child){margin-top:25px}h2 b{display:inline-grid;place-items:center;background:#366b55;color:#fff;border-radius:8px;width:26px;height:26px;margin-right:7px}.grid{display:grid;gap:9px}.top{grid-template-columns:repeat(2,1fr)}.counts{grid-template-columns:repeat(4,1fr)}label{font-size:12px;font-weight:bold;color:#596860;display:flex;flex-direction:column;gap:5px}input,select,button{font:inherit}input,select{height:44px;border:1px solid #cbd5cd;border-radius:10px;padding:0 10px;background:#fbfcfa;font-size:15px}.count{padding:9px;background:#fafbf8;border:1px solid #dce3d9;border-radius:11px;display:grid;grid-template-columns:1fr 55px;align-items:center}.count small{display:block;color:#7b8781;font-size:9px}.count input{text-align:center;height:38px}.room{display:flex;gap:7px;align-items:center;margin-bottom:10px}.room span{margin-right:auto;font-size:12px;font-weight:bold}.room button,.add{border:1px solid #cad5cd;background:#fff;border-radius:9px;padding:9px 12px;font-weight:bold}.room button.on{background:#366b55;color:#fff}.nights{display:grid;gap:7px}.night{display:grid;grid-template-columns:70px 1fr 34px;align-items:center;background:#f3f5ee;padding:8px;border-radius:10px}.night button{border:0;background:transparent;font-size:20px}.add{color:#366b55;border-style:dashed}.result{margin-top:18px;overflow:hidden}.result>p{padding:18px 20px 3px;margin:0;font-size:12px;font-weight:bold;color:#6b7971}.amount{margin:0 15px;padding:20px 16px;background:#fff3dd;color:#71470d;border-radius:15px}.amount.refund{background:#e6f3eb;color:#245d45}.amount span{display:block;font-size:13px;font-weight:bold}.amount strong{font-size:35px}.summary{padding:14px 20px}.summary div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf0ec;font-size:13px}.summary .total{font-size:15px;border-bottom:2px solid #25332d}.summary .off b{color:#a33b32}.warn{margin:8px 15px;background:#fff0ee;color:#a33b32;padding:10px;border-radius:9px;font-size:11px;font-weight:bold}.detail{margin:0 20px 17px;background:#f7f8f5;padding:12px;border-radius:10px;font-size:12px}.detail div{padding:7px 0;border-bottom:1px solid #dce3d9}.detail div:last-child{border:0}.detail span{float:right}.hint{padding:13px 20px!important;background:#f7f8f5;font-size:10px!important;font-weight:normal!important}.tax{margin-top:13px;font-size:12px}.tax input{width:80px;height:36px;margin:8px}.tax p{margin:0;color:#6b7971}@media(max-width:850px){.counts{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){main{padding:10px}.form{padding:16px}.top{grid-template-columns:1fr}.amount strong{font-size:30px}.mode-switch{grid-template-columns:1fr}.mode-switch button{padding:10px 6px}}
.count select{text-align:center;height:38px;padding:0 3px;cursor:pointer}.old-people{margin-top:18px;padding-top:16px;border-top:1px solid #e3e8e1}.old-people h3{margin:0 0 10px;font-size:14px;color:#3e554a}.old-people p{margin:0 0 10px;color:#6b7971;font-size:11px}
</style></head><body><main class="check-mode"><header><div class="logo">の</div><div><p>湯布院旅館のぎく</p><h1>宿泊料金かんたん確認</h1></div></header><nav class="mode-switch" aria-label="計算モード"><button class="on" data-mode="check" aria-pressed="true">通常の料金確認</button><button data-mode="change" aria-pressed="false">人数変更の差額計算</button></nav><div class="layout"><section class="card form">
<h2><b>1</b><span id="infoTitle">予約内容</span></h2><div class="grid top"><label class="change-only">事前決済済み金額<input id="paid" type="number" min="0" inputmode="numeric" placeholder="金額を入力"></label><label>予約元<select id="ota"><option>Agoda</option><option>じゃらん</option><option>楽天</option><option>その他</option></select></label><label>OTA割引率（%）<input id="discount" type="number" min="0" max="100" inputmode="decimal" value="20"></label></div><div class="old-people change-only"><h3>予約時の人数</h3><p>人数変更前の予約内容を選択してください。</p><div class="grid counts" id="oldCounts"></div></div>
<h2><b>2</b><span id="peopleTitle">宿泊人数</span></h2><div class="grid counts" id="counts"></div>
<h2><b>3</b>宿泊日ごとの料金区分</h2><div class="room"><span>料金タイプ</span><button data-room="5" class="on">離れ</button><button data-room="3">長屋</button></div><div class="nights" id="nights"></div><button class="add" id="add">＋ 1泊追加</button>
<details class="tax"><summary>入湯税の設定</summary><label>13歳以上・1名・1泊あたり <input id="tax" type="number" min="0" value="250"> 円</label><p>通常確認では、じゃらん・楽天は料金に含まれるため加算せず、その他の予約元は13歳以上全員に加算します。人数変更では、すべての予約元で予約時より増えた13歳以上の人数にのみ加算します。OTA割引の対象には含めません。</p></details></section>
<aside class="card result"><p id="resultTitle">料金確認結果</p><div id="warn"></div><div class="amount" id="amount"><span id="amountLabel"></span><strong id="difference"></strong></div><div class="summary"><div><span id="stayLabel">宿泊料金</span><b id="stay"></b></div><div class="off"><span>OTA割引</span><b id="off"></b></div><div><span>入湯税</span><b id="bath"></b></div><div class="total"><span id="totalLabel">合計金額</span><b id="total"></b></div><div class="change-only"><span>事前決済済み</span><b id="paidOut"></b></div></div><details class="detail"><summary>1泊ごとの内訳</summary><div id="detail"></div></details><p class="hint">金額は入力と同時に更新されます。最終確認は予約内容と照合してください。</p></aside></div></main><script>
const L={85:'85 平1〜',101:'101 平1〜',112:'112 平日',122:'122 平日',132:'132 祝前',142:'142 祝前',152:'152 特日',172:'172 特日'};
const R={5:{85:[18750,12500,11250,10000,9375],101:[22500,15000,13750,12500,11875],112:[0,16500,15250,14000,13375],122:[0,18000,16750,15500,14875],132:[0,19500,18250,17000,16375],142:[0,21000,19750,18500,17875],152:[0,22500,21250,20000,19375],172:[0,25500,24250,23000,22375]},3:{85:[16000,10625,9375],101:[18750,12500,11250],112:[0,13750,12500],122:[0,15000,13750],132:[0,16250,15000],142:[0,17500,16250],152:[0,18750,17500],172:[0,21250,20000]}};
const defs=[['adult','大人・A','13歳以上・100%',2],['b','B','6〜12歳・70%',0],['cf','C 布団あり','3〜5歳',0],['cn','C 布団なし','3〜5歳',0],['df','D 布団あり','0〜2歳',0],['dn','D 布団なし','0〜2歳',0]];let room='5',nights=['112'],mode='check';
const $=id=>document.getElementById(id),n=id=>Math.max(0,Number($(id).value)||0),yen=x=>Math.round(x).toLocaleString('ja-JP')+'円';
$('counts').innerHTML=defs.map(([id,a,b,v])=>`<label class="count"><span>${a}<small>${b}</small></span><select id="${id}" aria-label="${a}の人数">${Array.from({length:11},(_,i)=>`<option value="${i}" ${i===v?'selected':''}>${i}名</option>`).join('')}</select></label>`).join('');
$('oldCounts').innerHTML=defs.map(([id,a,b,v])=>`<label class="count"><span>${a}<small>${b}</small></span><select id="old${id[0].toUpperCase()+id.slice(1)}" aria-label="予約時の${a}の人数">${Array.from({length:11},(_,i)=>`<option value="${i}" ${i===v?'selected':''}>${i}名</option>`).join('')}</select></label>`).join('');
function drawNights(){$('nights').innerHTML=nights.map((v,i)=>`<div class="night"><strong>${i+1}泊目</strong><select data-night="${i}">${Object.entries(L).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('')}</select>${nights.length>1?`<button data-del="${i}">×</button>`:'<i></i>'}</div>`).join('');document.querySelectorAll('[data-night]').forEach(x=>x.onchange=e=>{nights[+e.target.dataset.night]=e.target.value;calc()});document.querySelectorAll('[data-del]').forEach(x=>x.onclick=e=>{nights.splice(+e.target.dataset.del,1);drawNights();calc()})}
function calc(){const ota=$('ota').value,disc=n('discount'),pg=n('adult')+n('b')+n('cf')+n('df'),capacity=+room,appliedPeople=Math.min(Math.max(pg,1),capacity),idx=appliedPeople-1,over=pg>capacity,dfr=ota==='Agoda'?3500:['じゃらん','楽天'].includes(ota)?1500:3500,dnr=ota==='Agoda'?2000:['じゃらん','楽天'].includes(ota)?0:2000,futonFee=n('cf')*3500+n('df')*dfr,noFutonFee=n('cn')*2000+n('dn')*dnr,existingCn=Math.min(n('cn'),n('oldCn')),existingDn=Math.min(n('dn'),n('oldDn')),addedCn=Math.max(0,n('cn')-n('oldCn')),addedDn=Math.max(0,n('dn')-n('oldDn')),taxIncludedOta=['じゃらん','楽天'].includes(ota),taxPeople=mode==='change'?Math.max(0,n('adult')-n('oldAdult')):taxIncludedOta?0:n('adult');let stay=0,off=0,bath=0,total=0,detail='';nights.forEach((k,i)=>{const unit=pg>0?(R[room][k][idx]||0):0,standard=unit*n('adult')+unit*.7*n('b')+futonFee,discountableNoFuton=mode==='change'?existingCn*2000+existingDn*dnr:noFutonFee,fullPriceNoFuton=mode==='change'?addedCn*2000+addedDn*dnr:0,discountable=standard+discountableNoFuton,base=discountable+fullPriceNoFuton,cut=discountable*disc/100,t=taxPeople*n('tax'),sum=base-cut+t;stay+=base;off+=cut;bath+=t;total+=sum;detail+=`<div><b>${i+1}泊目・${L[k]}</b><span>${yen(sum)}</span><br><small>実際 ${pg}名／適用単価 ${appliedPeople}名料金・${yen(unit)}／布団なし料金 ${yen(discountableNoFuton+fullPriceNoFuton)}（追加分 ${yen(fullPriceNoFuton)}は割引なし）／入湯税 ${yen(t)}</small></div>`});const diff=total-n('paid'),roomName=room==='5'?'離れ':'長屋';$('warn').innerHTML=over?`<div class="warn">注意：${roomName}の通常定員${capacity}名を超えています。${capacity}名料金の単価で計算しています。</div>`:pg===0?'<div class="warn">料金表の対象人数を1名以上選択してください。</div>':'';const shown=mode==='check'?total:Math.abs(diff);$('amount').className='amount'+(mode==='change'&&diff<0?' refund':'');$('amountLabel').textContent=mode==='check'?'正しい予約金額':diff>=0?'追加でいただく金額':'返金確認額';$('difference').textContent=yen(shown);$('stay').textContent=yen(stay);$('off').textContent='− '+yen(off);$('bath').textContent='＋ '+yen(bath);$('total').textContent=yen(total);$('paidOut').textContent='− '+yen(n('paid'));$('detail').innerHTML=detail}
document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',calc));['paid','discount','tax'].forEach(id=>$(id).addEventListener('focus',e=>e.target.select()));document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=e=>{mode=e.currentTarget.dataset.mode;document.querySelector('main').classList.toggle('check-mode',mode==='check');document.querySelectorAll('[data-mode]').forEach(b=>{const on=b.dataset.mode===mode;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});$('infoTitle').textContent=mode==='check'?'予約内容':'予約情報と変更内容';$('peopleTitle').textContent=mode==='check'?'宿泊人数':'変更後の人数';$('resultTitle').textContent=mode==='check'?'料金確認結果':'人数変更の計算結果';$('stayLabel').textContent=mode==='check'?'宿泊料金':'変更後の宿泊料金';$('totalLabel').textContent=mode==='check'?'合計金額':'変更後合計';calc()});document.querySelectorAll('[data-room]').forEach(x=>x.onclick=e=>{room=e.target.dataset.room;document.querySelectorAll('[data-room]').forEach(b=>b.classList.toggle('on',b===e.target));calc()});$('add').onclick=()=>{nights.push(nights[nights.length-1]);drawNights();calc()};drawNights();calc();
</script></body></html>
