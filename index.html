}
const money=x=>'¥'+Math.round(x).toLocaleString(guestLang==='en'?'en-US':guestLang==='ko'?'ko-KR':guestLang.startsWith('zh')?'zh-CN':'ja-JP');
function guestPeople(c,t){const names={ja:{adult:'大人',b:'子供B',cf:'幼児C（布団あり）',cn:'幼児C（布団なし）',df:'幼児D（布団あり）',dn:'幼児D（布団なし）'},en:{adult:'Adult',b:'Child B',cf:'Child C (with futon)',cn:'Child C (no futon)',df:'Infant D (with futon)',dn:'Infant D (no futon)'},'zh-CN':{adult:'成人',b:'儿童B',cf:'幼儿C（含被褥）',cn:'幼儿C（不含被褥）',df:'婴幼儿D（含被褥）',dn:'婴幼儿D（不含被褥）'},'zh-TW':{adult:'成人',b:'兒童B',cf:'幼兒C（含寢具）',cn:'幼兒C（不含寢具）',df:'嬰幼兒D（含寢具）',dn:'嬰幼兒D（不含寢具）'},ko:{adult:'성인',b:'어린이 B',cf:'유아 C(이불 있음)',cn:'유아 C(이불 없음)',df:'영아 D(이불 있음)',dn:'영아 D(이불 없음)'}}[guestLang];return Object.entries(c).filter(([,v])=>v>0).map(([k,v])=>`${names[k]} ${v}${t.person}`).join(' ＋ ')||'—'}
function renderGuest(){if(!lastCalc)return;const d=lastCalc,t=GT[guestLang],line=(a,b)=>`<div class="guest-line"><span>${a}</span><b>${b}</b></div>`,nightName=(r,i)=>`${t.night(i+1)}・${guestLang==='ja'?L[r.k]:r.k}`,oldUnits=d.nightRows.map((r,i)=>`<div class="guest-night"><div class="guest-night-title">${nightName(r,i)}</div>${line(t.rate,t.rateName(d.oldApplied))}${line(t.per,money(r.oldUnit))}</div>`).join(''),newUnits=d.nightRows.map((r,i)=>{let rows=line(t.rate,t.rateName(d.appliedPeople))+line(t.per,money(r.unit));if(d.counts.adult)rows+=line(t.adult,`${money(r.unit)} × ${d.counts.adult}${t.person} ＝ ${money(r.adultCost)}`);if(d.counts.b)rows+=line(t.b,`${money(r.unit)} × 70% × ${d.counts.b}${t.person} ＝ ${money(r.bCost)}`);if(d.counts.cf)rows+=line(t.cf,`${money(3500)} × ${d.counts.cf}${t.person} ＝ ${money(3500*d.counts.cf)}`);if(d.counts.cn)rows+=line(t.cn,`${money(2000)} × ${d.counts.cn}${t.person} ＝ ${money(2000*d.counts.cn)}`);if(d.counts.df)rows+=line(t.df,`${money(d.dfr)} × ${d.counts.df}${t.person} ＝ ${money(d.dfr*d.counts.df)}`);if(d.counts.dn)rows+=line(t.dn,`${money(d.dnr)} × ${d.counts.dn}${t.person} ＝ ${money(d.dnr*d.counts.dn)}`);return `<div class="guest-night"><div class="guest-night-title">${nightName(r,i)}</div>${rows}</div>`}).join('');
 $('gTitle').textContent=t.title;$('guestPrint').textContent=t.print;$('guestDone').textContent=t.close;$('guestContent').innerHTML=`<section class="guest-block"><h3>${t.before}</h3><div class="guest-body">${line(t.people,guestPeople(d.oldCounts,t))}${oldUnits}</div></section><section class="guest-block after"><h3>${t.after}</h3><div class="guest-body">${line(t.people,guestPeople(d.counts,t))}${newUnits}</div></section><section class="guest-block"><h3>${t.breakdown}</h3><div class="guest-body">${line(t.stay,money(d.stay))}${d.off?line(t.discount,'− '+money(d.off)):''}${d.bath?line(t.tax,'＋ '+money(d.bath)):''}${line(t.changed,money(d.total))}${line(t.paid,'− '+money(d.paid))}</div></section><div class="guest-final"><span>${d.diff>=0?t.additional:t.refund}</span><strong>${money(Math.abs(d.diff))}</strong></div><p class="guest-note">${d.over?t.over(d.capacity):t.note(d.appliedPeople)}</p>`}
document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',calc));['paid','discount','tax'].forEach(id=>$(id).addEventListener('focus',e=>e.target.select()));document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=e=>{mode=e.currentTarget.dataset.mode;document.querySelector('main').classList.toggle('check-mode',mode==='check');document.querySelectorAll('[data-mode]').forEach(b=>{const on=b.dataset.mode===mode;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});$('infoTitle').textContent=mode==='check'?'予約内容':'予約情報と変更内容';$('peopleTitle').textContent=mode==='check'?'宿泊人数':'変更後の人数';$('resultTitle').textContent=mode==='check'?'料金確認結果':'人数変更の計算結果';$('stayLabel').textContent=mode==='check'?'宿泊料金':'変更後の宿泊料金';$('totalLabel').textContent=mode==='check'?'合計金額':'変更後合計';calc()});document.querySelectorAll('[data-room]').forEach(x=>x.onclick=e=>{room=e.target.dataset.room;document.querySelectorAll('[data-room]').forEach(b=>b.classList.toggle('on',b===e.target));calc()});$('add').onclick=()=>{nights.push(nights[nights.length-1]);drawNights();calc()};
$('guestOpen').onclick=()=>{renderGuest();$('guestDialog').showModal()};const closeGuest=()=>{$('guestDialog').close();document.documentElement.lang='ja'};$('guestClose').onclick=$('guestDone').onclick=closeGuest;$('guestPrint').onclick=()=>window.print();document.querySelectorAll('[data-lang]').forEach(x=>x.onclick=e=>{guestLang=e.currentTarget.dataset.lang;document.documentElement.lang=guestLang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b===e.currentTarget));renderGuest()});$('guestDialog').addEventListener('click',e=>{if(e.target===$('guestDialog'))closeGuest()});drawNights();calc();
</script></body></html>
